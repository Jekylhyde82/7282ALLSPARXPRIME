name = "allsparx-prime-gateway"
main = "src/index.js"
compatibility_date = "2026-10-30"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://cloudcredits.io,https://www.cloudcredits.io"
RATE_LIMIT_PER_MINUTE = "10"
MAX_REQUEST_COST_MICROS = "50000"
MONTHLY_SPEND_LIMIT_MICROS = "20000000"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "SPEND_BUDGET"
class_name = "SpendBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter", "SpendBudget"]

[[durable_objects.bindings]]
name = "EVIDENCE_LEDGER"
class_name = "EvidenceLedger"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EvidenceLedger"]
