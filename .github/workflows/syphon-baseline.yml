name: SYPHON baseline checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [syphon/allsparx-prime-integration-plan]

permissions:
  contents: read

concurrency:
  group: syphon-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Astro validation and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Run Astro type and content checks
        id: check
        run: pnpm check

      - name: Run production build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm build
