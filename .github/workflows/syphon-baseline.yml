name: SYPHON baseline checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: syphon-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Astro validation and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install locked dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Run SYPHON runtime contract tests
        id: syphon-tests
        run: pnpm test:syphon
      - name: Run capability manifest contract tests
        id: capability-manifest-tests
        run: pnpm test:capability-manifest
      - name: Run capability manifest schema validation tests
        id: capability-manifest-validation-tests
        run: pnpm test:capability-manifest-validation
      - name: Run read-only capability discovery tests
        id: capability-discovery-tests
        run: pnpm test:capability-discovery
      - name: Run repository snapshot acquisition tests
        id: repository-snapshot-acquirer-tests
        run: pnpm test:repository-snapshot-acquirer
      - name: Run source repository inventory contract tests
        id: source-repository-record-tests
        run: pnpm test:source-repository-record
      - name: Run capability registry contract tests
        id: capability-registry-tests
        run: pnpm test:capability-registry
      - name: Run capability registry chain integrity tests
        id: capability-registry-chain-tests
        run: pnpm test:capability-registry-chain
      - name: Run capability policy tests
        id: capability-policy-tests
        run: pnpm test:capability-policy
      - name: Run Astro type and content checks
        id: check
        run: pnpm check
      - name: Run production build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: pnpm build
