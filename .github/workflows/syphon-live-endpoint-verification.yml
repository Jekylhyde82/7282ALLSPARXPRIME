name: SYPHON live endpoint verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-endpoint:
    name: Verify configured AI endpoint contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one bounded contract smoke test
        env:
          AI_CHAT_ENDPOINT: ${{ secrets.AI_CHAT_ENDPOINT }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.AI_CHAT_ENDPOINT;
          if (!endpoint) {
            console.error("BLOCKED: add the approved endpoint URL as the repository Actions secret AI_CHAT_ENDPOINT.");
            process.exit(2);
          }

          let url;
          try {
            url = new URL(endpoint);
          } catch {
            console.error("FAIL: AI_CHAT_ENDPOINT is not an absolute URL.");
            process.exit(1);
          }
          if (url.protocol !== "https:") {
            console.error("FAIL: live verification requires an HTTPS endpoint.");
            process.exit(1);
          }

          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 30_000);
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                prompt: "SYPHON endpoint contract check. Return a short summary and an empty programs array."
              }),
              signal: controller.signal
            });

            if (!response.ok) {
              console.error(`FAIL: endpoint returned HTTP ${response.status}; response content and URL are intentionally not logged.`);
              process.exit(1);
            }

            let body;
            try {
              body = await response.json();
            } catch {
              console.error("FAIL: endpoint returned a non-JSON response.");
              process.exit(1);
            }

            const validPrograms =
              body &&
              (body.programs === undefined ||
                (Array.isArray(body.programs) &&
                  body.programs.every(
                    (program) =>
                      program &&
                      typeof program === "object" &&
                      typeof program.title === "string"
                  )));

            if (!body || typeof body.summary !== "string" || !validPrograms) {
              console.error("FAIL: JSON response does not match the Ask AI contract (summary string and optional programs array of title strings).");
              process.exit(1);
            }

            console.log("PASS: live HTTPS endpoint responded successfully and its JSON matches the Ask AI response contract.");
            console.log(`Validated summary field; ${(body.programs ?? []).length} program match(es) returned. Response text and endpoint URL were not logged.`);
          } catch (error) {
            if (controller.signal.aborted) {
              console.error("FAIL: endpoint exceeded the 30-second timeout.");
            } else {
              console.error(`FAIL: endpoint request failed (${error instanceof Error ? error.name : "unknown error"}); URL and response content were not logged.`);
            }
            process.exit(1);
          } finally {
            clearTimeout(timeout);
          }
          NODE
