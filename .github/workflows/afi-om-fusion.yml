name: AFI OM fusion contract

on:
  pull_request:
    paths:
      - "src/lib/allsparxPrime/afi-om-fusion.mjs"
      - "src/lib/allsparxPrime/capability-registry-chain.mjs"
      - "schemas/afi-om-fusion-packet.schema.json"
      - "tests/afi-om-fusion.test.mjs"
      - "tests/capability-registry-chain.test.mjs"
      - ".github/workflows/afi-om-fusion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afi-om-fusion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: AFI OM contract and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete Node regression suite
        run: node --test tests/*.test.mjs
      - name: Run Astro type and content checks
        run: pnpm check
      - name: Run production build
        run: pnpm build
      - name: Check patch whitespace
        run: git diff --check
