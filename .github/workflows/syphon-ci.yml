name: SYPHON CI

on:
  pull_request:
    branches:
      - main
      - syphon/multi-provider-foundation
  push:
    branches:
      - main
      - syphon/server-gateway-security

permissions:
  contents: read

concurrency:
  group: syphon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Runtime, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run SYPHON contract and security tests
        run: pnpm test:syphon
      - name: Run Astro type checks
        run: pnpm check
      - name: Build production static assets
        run: pnpm build
