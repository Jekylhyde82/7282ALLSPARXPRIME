name: Performance Lab Validation

on:
  pull_request:
    paths:
      - "tools/performance-lab/**"
      - "tests/performance-lab.test.mjs"
      - ".github/workflows/performance-lab.yml"
  push:
    branches:
      - "engineering/performance-lab-foundation"
    paths:
      - "tools/performance-lab/**"
      - "tests/performance-lab.test.mjs"
      - ".github/workflows/performance-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned JSON Schema validator
        run: |
          npm install --prefix "$RUNNER_TEMP/performance-lab-validator" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund ajv@8.17.1
          ln -s "$RUNNER_TEMP/performance-lab-validator/node_modules" node_modules
          node -e 'const v=require("./node_modules/ajv/package.json").version; if (v !== "8.17.1") process.exit(1)'
      - name: Run Performance Lab tests
        run: node --test tests/performance-lab.test.mjs
      - name: Validate benchmark case definitions
        run: node -e "const c=require('./tools/performance-lab/cases.json'); if(c.cases.length!==5 || new Set(c.cases.map(x=>x.id)).size!==5) process.exit(1); console.log('Five unique benchmark cases validated.')"
      - name: Validate 30-row trial matrix and isolation gates
        run: node tools/performance-lab/runner.mjs validate-matrix tools/performance-lab/evidence/trial-matrix.csv
