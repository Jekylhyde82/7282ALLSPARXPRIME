name = "cloudcredits-io"
main = "src/worker.mjs"
compatibility_date = "2025-08-22"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
run_worker_first = ["/api/*"]

[[ratelimits]]
name = "USER_RATE_LIMITER"
namespace_id = "7282001"

  [ratelimits.simple]
  limit = 12
  period = 60
