name = "cloudcredits-io"
main = "./src/worker/index.mjs"
compatibility_date = "2025-08-22"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "allsparx-prime-repository-snapshots"

[[durable_objects.bindings]]
name = "SNAPSHOT_COORDINATOR"
class_name = "SnapshotCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SnapshotCoordinator"]

[vars]
GITHUB_TARGET_REPOSITORY = "Jekylhyde82/7282ALLSPARXPRIME"
GITHUB_TARGET_BRANCH = "main"
